<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الاختبار | DR AMIRA SALIM</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" defer></script>
  <script src="exam.js" defer></script>
</head>

<body>

<header class="site-header">

  <div class="container nav-container">

    <a href="index.html" class="logo">
      DR AMIRA SALIM
    </a>

    <div class="nav-actions">

      <button id="themeBtn" class="icon-btn">
        🌙
      </button>

      <a href="student.html" class="btn secondary-btn">
        لوحة الطالب
      </a>

    </div>

  </div>

</header>


<main class="container">

  <section class="exam-page">

    <div id="examLoading" class="loading">
      جاري تحميل الاختبار...
    </div>


    <div
      id="examError"
      class="empty-state"
      style="display:none;"
    >

      <h3>
        تعذر تحميل الاختبار
      </h3>

      <p id="examErrorText"></p>

      <a
        href="student.html"
        class="btn primary-btn"
      >
        العودة للوحة الطالب
      </a>

    </div>


    <div
      id="examContent"
      style="display:none;"
    >

      <div class="exam-header">

        <span class="badge">
          اختبار المحاضرة
        </span>

        <h1 id="examTitle">
          —
        </h1>

        <p id="examDescription"></p>

        <div class="exam-info">

          <span>
            المحاضرة:
            <strong id="lectureTitle">—</strong>
          </span>

          <span>
            الدرجة:
            <strong id="maxScore">—</strong>
          </span>

        </div>

      </div>


      <form id="examForm">

        <div id="questionsContainer"></div>

        <button
          id="submitExamBtn"
          type="submit"
          class="btn primary-btn exam-submit-btn"
        >
          إرسال الاختبار
        </button>

      </form>

    </div>


    <div
      id="resultContent"
      style="display:none;"
      class="result-card"
    >

      <div class="result-icon">
        ✓
      </div>

      <span class="badge">
        تم تصحيح الاختبار
      </span>

      <h2>
        نتيجتك
      </h2>

      <div class="result-score">

        <strong id="resultScore">
          0
        </strong>

        <span>
          /
          <span id="resultMaxScore">
            0
          </span>
        </span>

      </div>

      <p id="resultPercentage">
        0%
      </p>

      <p id="resultMessage"></p>

      <a
        href="student.html"
        class="btn primary-btn"
      >
        العودة للوحة الطالب
      </a>

    </div>

  </section>

</main>


<footer class="site-footer">

  <div class="container">

    <p>
      © 2026 DR AMIRA SALIM — Nursing Courses
    </p>

  </div>

</footer>

</body>
</html>
