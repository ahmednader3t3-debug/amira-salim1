<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الطالب | DR AMIRA SALIM</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body class="dashboard">

  <!-- HEADER -->
  <header class="header">

    <div class="container nav">

      <a href="student.html" class="brand">
        <span class="brand-main">DR AMIRA SALIM</span>
        <span class="brand-sub">NURSING COURSES</span>
      </a>


      <div class="dashboard-actions">

        <!-- DARK / LIGHT -->
        <button
          id="themeBtn"
          class="icon-btn"
          type="button"
          title="تغيير المظهر"
        >
          🌙
        </button>


        <!-- WHATSAPP -->
        <a
          id="whatsappBtn"
          href="#"
          target="_blank"
          class="btn btn-outline"
        >
          واتساب
        </a>


        <!-- ACCOUNT -->
        <div class="account-menu">

          <button
            id="accountBtn"
            class="avatar"
            type="button"
          >
            A
          </button>


          <div
            id="accountDropdown"
            class="account-dropdown"
          >

            <div
              style="
                padding:10px 12px;
                border-bottom:1px solid var(--border);
                margin-bottom:5px;
              "
            >

              <strong id="profileName">
                الطالب
              </strong>

              <div
                id="profileEmail"
                style="
                  color:var(--muted);
                  font-size:11px;
                  word-break:break-word;
                "
              >
                ...
              </div>

            </div>


            <button id="logoutBtn">
              🚪 تسجيل الخروج
            </button>

          </div>

        </div>

      </div>

    </div>

  </header>


  <!-- MAIN -->
  <main class="dashboard-main">

    <div class="container">

      <!-- TOP -->
      <div class="dashboard-top">

        <div class="dashboard-title">

          <h1>
            أهلاً بيك 👋
            <span id="welcomeName">...</span>
          </h1>

          <p>
            اختار الكورس وابدأ التعلم.
          </p>

        </div>


        <!-- YEAR -->
        <div style="min-width:200px;">

          <label
            for="academicYear"
            style="
              display:block;
              font-size:12px;
              font-weight:700;
              margin-bottom:6px;
            "
          >
            السنة الدراسية
          </label>

          <select
            id="academicYear"
            style="
              width:100%;
              padding:11px 13px;
              border:1px solid var(--border);
              border-radius:12px;
              background:var(--surface);
              color:var(--text);
              outline:none;
            "
          >

            <option value="1">
              الفرقة الأولى
            </option>

            <option value="2">
              الفرقة الثانية
            </option>

            <option value="3">
              الفرقة الثالثة
            </option>

          </select>

        </div>

      </div>


      <!-- STATS -->
      <section class="dashboard-stats">

        <div class="dashboard-stat">

          <span>
            الكورسات المتاحة
          </span>

          <strong id="coursesCount">
            0
          </strong>

        </div>


        <div class="dashboard-stat">

          <span>
            السنة الدراسية
          </span>

          <strong id="yearText">
            -
          </strong>

        </div>


        <div class="dashboard-stat">

          <span>
            الاختبارات
          </span>

          <strong id="examsCount">
            0
          </strong>

        </div>

      </section>


      <!-- COURSES -->
      <section>

        <div class="dashboard-section-title">

          <h2>
            الكورسات
          </h2>

          <p
            style="
              color:var(--muted);
              font-size:13px;
            "
          >
            الكورسات الخاصة بسنتك الدراسية
          </p>

        </div>


        <div
          id="coursesGrid"
          class="cards-grid"
        >

          <div class="loading-card">

            <div class="loader"></div>

            <p>
              جاري تحميل الكورسات...
            </p>

          </div>

        </div>

      </section>


      <!-- LECTURES -->
      <section
        id="courseContent"
        style="
          display:none;
          margin-top:55px;
        "
      >

        <div class="section-heading">

          <div>

            <span
              id="selectedCourseYear"
              class="section-kicker"
            >
              COURSE
            </span>

            <h2 id="selectedCourseTitle">
              المحاضرات
            </h2>

            <p id="selectedCourseDescription">
            </p>

          </div>


          <button
            id="backCoursesBtn"
            class="btn btn-outline"
            type="button"
          >
            ← كل الكورسات
          </button>

        </div>


        <div
          id="lecturesList"
          class="lecture-list"
        >
        </div>

      </section>

    </div>

  </main>


  <script src="student.js"></script>

</body>
</html>
