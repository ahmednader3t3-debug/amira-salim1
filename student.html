<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة الطالب | أميرة سليم</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="header">

  <div class="container nav">

    <a class="brand" href="student.html">
      <span class="logo">AS</span>

      <span>
        <b>أميرة سليم</b>
        <small>NURSING ACADEMY</small>
      </span>
    </a>

    <div style="display:flex;align-items:center;gap:12px">

      <button
        id="profileBtn"
        class="btn small"
        type="button"
        title="حسابي">
        👤
      </button>

      <button
        id="logout"
        class="btn small"
        type="button">
        تسجيل الخروج
      </button>

    </div>

  </div>

</header>


<main class="section">

<div class="container">

  <div class="dashboard-head">

    <div>

      <span class="eyebrow">
        لوحة الطالب
      </span>

      <h1 id="welcome">
        أهلاً بك
      </h1>

      <p>
        تابع كورساتك ومحاضراتك وامتحاناتك من مكان واحد.
      </p>

    </div>

  </div>


  <!-- ACCOUNT -->

  <section
    id="profilePanel"
    class="dashboard-section"
    style="display:none">

    <div class="dashboard-title">

      <div>

        <span class="eyebrow">
          ACCOUNT
        </span>

        <h2>
          حسابي
        </h2>

      </div>

    </div>

    <div class="course">

      <h3 id="profileName">
        -
      </h3>

      <p>
        البريد الإلكتروني:
        <strong id="profileEmail">-</strong>
      </p>

    </div>

  </section>


  <!-- COURSES -->

  <section class="dashboard-section">

    <div class="dashboard-title">

      <div>

        <span class="eyebrow">
          EDUCATION
        </span>

        <h2>
          كورساتي
        </h2>

      </div>

    </div>

    <div
      id="studentCourses"
      class="grid">

      <div class="loading">
        جاري تحميل الكورسات...
      </div>

    </div>

  </section>


  <!-- LECTURES -->

  <section
    id="lecturesSection"
    class="dashboard-section"
    style="display:none">

    <div class="dashboard-title">

      <div>

        <span class="eyebrow">
          COURSE CONTENT
        </span>

        <h2 id="selectedCourseTitle">
          المحاضرات
        </h2>

      </div>

    </div>

    <div
      id="lecturesList"
      class="dashboard-list">

    </div>

  </section>

</div>

</main>


<script src="config.js"></script>
<script src="student.js"></script>

</body>
</html>
